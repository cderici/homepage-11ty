<!doctype html>
<!-- Link-preview card (og:image). Render to src/assets/img/og-card.jpg with:
     google-chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png design/og/card.html
     then convert to JPEG (see NOTES.md). Uses the site's own fonts and colours. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 100 900; src: url("../../src/assets/fonts/inter-latin-wght-normal.woff2"); }
@font-face { font-family: Geist; font-weight: 100 900; src: url("../../src/assets/fonts/geist-latin-wght-normal.woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../src/assets/fonts/jetbrains-mono-latin-wght-normal.woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background:
    radial-gradient(900px 600px at 8% -10%, color-mix(in oklab, #ff6a1a 22%, transparent), transparent 70%),
    radial-gradient(800px 600px at 105% 40%, color-mix(in oklab, #55cfe8 12%, transparent), transparent 70%),
    radial-gradient(1400px 700px at 50% 130%, color-mix(in oklab, #2f63b8 26%, transparent), transparent 70%),
    #0d1422;
  font-family: Geist, sans-serif; color: #e8ecf3;
  display: grid; grid-template-columns: 400px 1fr; gap: 64px; align-items: center; padding: 0 80px; box-sizing: border-box;
}
.photo {
  width: 400px; height: 400px; border-radius: 22px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 1px #2b3954, 0 0 60px -20px #55cfe8;
}
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
.label { font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #ff7a33;
  display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.label::after { content: ""; width: 140px; height: 2px; background: linear-gradient(90deg, #ff7a33aa, transparent); }
h1 { font-family: Inter, sans-serif; font-weight: 650; font-size: 60px; line-height: 1.05; margin: 0 0 30px; white-space: nowrap; letter-spacing: -.01em; }
.role { font-size: 34px; line-height: 1.35; color: #e8ecf3; }
.role b { font-weight: 500; }
.where { font-size: 26px; color: #95a0b6; margin-top: 8px; }
.url { font-family: "JetBrains Mono", monospace; font-size: 22px; color: #ffa06b; margin-top: 44px; }
.hair { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #ff7a33 30%, #ffc199 50%, #ff7a33 70%, transparent); box-shadow: 0 0 18px #ff7a33; }
</style></head>
<body>
  <div class="photo"><img src="headshot.jpg" alt=""></div>
  <div>
    <div class="label">Homepage</div>
    <h1>Caner Derici, PhD</h1>
    <div class="role"><b>Applied Scientist</b><br>Amazon – AWS</div>
    <div class="where">Austin, TX, USA</div>
    <div class="url">home.dericilab.live</div>
  </div>
  <div class="hair"></div>
</body></html>
